const CATEGORIES = [...new Set([...REGISTRY.values()].map(g => g.category))];
const byCategory = cat => [...REGISTRY.values()].filter(g => g.category === cat);

// ===== js/core/engine.js =====
// Render engine (spec §3, §14). render(project, analysis, t, ctx, w, h)
// is a pure function — the SAME code path draws preview frames and export
// frames; only resolution differs. No retained canvas state between frames.


const UNIVERSAL = [
  { key: "intensity", label: "Intensity", min: 0, max: 1, def: 0.8, step: 0.01 },
  { key: "opacity", label: "Opacity", min: 0, max: 1, def: 1, step: 0.01 },
  { key: "speed", label: "Speed", min: 0.1, max: 3, def: 1, step: 0.05 },
  { key: "scale", label: "Scale", min: 0.25, max: 4, def: 1, step: 0.01 },
  { key: "hueShift", label: "Hue shift", min: -180, max: 180, def: 0, step: 1 },
  { key: "glow", label: "Glow", min: 0, max: 1, def: 0.6, step: 0.01 },
  { key: "pulse", label: "Pulse str.", min: 0, max: 2, def: 1, step: 0.01 },
];
const BLENDS = ["add", "normal", "screen", "multiply"];
const BLEND_OP = { add: "lighter", normal: "source-over", screen: "screen", multiply: "multiply" };

function paramDef(gen, key) {
  return UNIVERSAL.find(p => p.key === key) || gen.params.find(p => p.key === key) || null;
}
function numericParams(gen) {
  return [...UNIVERSAL, ...gen.params.filter(p => p.select === undefined)];
}

// Resolve one parameter value with modulation applied.
function resolve(clip, gen, analysis, t, key) {
  const d = paramDef(gen, key);
  if (!d) return clip.params[key];
  if (d.select !== undefined) return clip.params[key] ?? d.def;
  const base = clip.params[key] ?? d.def;
  return applyMods(clip, analysis, t, key, base, d.min, d.max);
}

function makeEngine() {
  let snapCanvas = null, snapCtx = null;

  function snapshotOf(ctx, w, h) {
    if (!snapCanvas || snapCanvas.width !== w || snapCanvas.height !== h) {
      snapCanvas = (typeof OffscreenCanvas !== "undefined") ? new OffscreenCanvas(w, h)
        : Object.assign(document.createElement("canvas"), { width: w, height: h });
      snapCtx = snapCanvas.getContext("2d");
    }
    snapCtx.clearRect(0, 0, w, h);
    snapCtx.drawImage(ctx.canvas, 0, 0, w, h);
    return snapCanvas;
  }

  function makeG(clip, gen, analysis, t, ctx, w, h, palette, audio) {
    const speed = resolve(clip, gen, analysis, t, "speed");
    const local = (t - clip.start) * speed;
    const pal = PALETTES[palette] || PALETTES.cyberpunk;
    const hueShift = resolve(clip, gen, analysis, t, "hueShift") + (clip.params.palIdx ?? 0) * 0;
    const p = { palIdx: clip.params.palIdx ?? 0 };
    for (const d of [...UNIVERSAL, ...gen.params]) {
      p[d.key] = d.select !== undefined ? (clip.params[d.key] ?? d.def) : resolve(clip, gen, analysis, t, d.key);
    }
    const drift = t * 4;   // slow global hue drift (kept from V1's colour engine)
    return {
      ctx, w, h, t: local, T: t, p,
      a: audio, seed: clip.seed, clip,
      bpm: analysis ? analysis.bpm : 120,
      events: analysis ? analysis.events : { kick: [], snare: [], hat: [], drop: [] },
      beats: analysis ? analysis.beats : [],
      progress: (t - clip.start) / Math.max(0.001, clip.end - clip.start),
      glowPx: 10 + p.glow * 22,
      h01: i => hash01(clip.seed, i),
      c: (i, alpha = 1, boost = 0) =>
        hsl(pal.colors[(i + (clip.params.palIdx ?? 0)) % pal.colors.length], alpha, boost, hueShift + drift),
      cStrobe: alpha => hsl(pal.strobe, alpha, 0, 0),
      snapshot: () => snapshotOf(ctx, w, h),
    };
  }

  function clipAlpha(clip, gen, analysis, t) {
    let a = resolve(clip, gen, analysis, t, "opacity");
    if (clip.fadeIn > 0) a *= Math.min(1, (t - clip.start) / clip.fadeIn);
    if (clip.fadeOut > 0) a *= Math.min(1, (clip.end - t) / clip.fadeOut);
    return Math.max(0, Math.min(1, a));
  }

  return {
    render(project, analysis, t, ctx, w, h) {
      const layers = clipsAt(project, t);

      // active palette: project default, overridden by an fx.palette clip
      let palette = project.palette;
      for (const c of layers.adjust) {
        if (c.gen === "fx.palette") palette = c.params.palette || palette;
      }
      const pal = PALETTES[palette] || PALETTES.cyberpunk;

      // shared audio source values for this frame
      const audio = analysis ? {
        kick: sourceValue(analysis, "kick", t, 0, 140),
        snare: sourceValue(analysis, "snare", t, 0, 160),
        hat: sourceValue(analysis, "hat", t, 0, 80),
        bass: sourceValue(analysis, "bass", t),
        mid: sourceValue(analysis, "mid", t),
        high: sourceValue(analysis, "high", t),
        energy: sourceValue(analysis, "energy", t),
        loudness: sourceValue(analysis, "loudness", t),
      } : { kick: 0, snare: 0, hat: 0, bass: .4, mid: .3, high: .3, energy: .5, loudness: .4 };

      // background
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = hsl(pal.bg, 1);
      ctx.fillRect(0, 0, w, h);

      // camera transform (topmost active camera clip wins; §9.1)
      ctx.save();
      const camClip = layers.camera[layers.camera.length - 1];
      if (camClip) {
        const gen = REGISTRY.get(camClip.gen);
        if (gen && gen.cam) {
          const g = makeG(camClip, gen, analysis, t, ctx, w, h, palette, audio);
          const cam = gen.cam(g);
          const a = clipAlpha(camClip, gen, analysis, t);   // fade camera influence
          const zoom = 1 + (cam.zoom - 1) * a;
          ctx.translate(w / 2 + cam.dx * a, h / 2 + cam.dy * a);
          ctx.rotate(cam.rot * a);
          ctx.scale(zoom, zoom);
          ctx.translate(-w / 2, -h / 2);
        }
      }

      // visual clips bottom-to-top
      for (const clip of layers.visual) {
        const gen = REGISTRY.get(clip.gen);
        if (!gen || !gen.draw) continue;
        const alpha = clipAlpha(clip, gen, analysis, t);
        if (alpha <= 0.001) continue;
        const g = makeG(clip, gen, analysis, t, ctx, w, h, palette, audio);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = BLEND_OP[clip.params.blend || "add"] || "lighter";
        const sc = g.p.scale;
        if (sc !== 1) { ctx.translate(w / 2, h / 2); ctx.scale(sc, sc); ctx.translate(-w / 2, -h / 2); }
        gen.draw(g);
        ctx.restore();
      }

      ctx.restore();   // end camera

      // adjustment clips (over everything below camera transform)
      for (const clip of layers.adjust) {
        const gen = REGISTRY.get(clip.gen);
        if (!gen || !gen.draw || clip.gen === "fx.palette") continue;
        const alpha = clipAlpha(clip, gen, analysis, t);
        if (alpha <= 0.001) continue;
        const g = makeG(clip, gen, analysis, t, ctx, w, h, palette, audio);
        ctx.save();
        ctx.globalAlpha = alpha;
        gen.draw(g);
        ctx.restore();
      }

      // transitions last
      for (const clip of layers.transition) {
        const gen = REGISTRY.get(clip.gen);
        if (!gen || !gen.draw) continue;
        const g = makeG(clip, gen, analysis, t, ctx, w, h, palette, audio);
        ctx.save();
        gen.draw(g);
        ctx.restore();
      }

      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      return { palette, audio };
    },
  };
}

// ===== js/core/director.js =====
// Show Director (spec §9.8). Writes ordinary, editable clips into the
// project's tracks from the analysis. Clips are tagged auto:true; the
// contract: regenerate replaces ONLY still-tagged clips, never user edits.


// pools: section type -> weighted choices per role
const POOLS = {
  background: {
    intro: ["bg.nebula", "bg.gradient", "part.starfield"],
    build: ["bg.grid", "bg.gradient", "bg.matrix"],
    drop: ["bg.grid", "bg.gradient", "bg.sun"],
    breakdown: ["bg.nebula", "part.starfield", "bg.gradient"],
    groove: ["bg.gradient", "bg.grid", "bg.nebula", "bg.sun"],
    chorus: ["bg.sun", "bg.gradient"],
    outro: ["bg.nebula", "part.starfield"],
  },
  main: {
    intro: ["tunnel.rings", "geo.mandala", "spec.circle"],
    build: ["tunnel.hex", "laser.circle", "tunnel.warp", "geo.poly"],
    drop: ["laser.fan", "laser.burst", "tunnel.grid", "laser.cross", "tunnel.star", "laser.stadium"],
    breakdown: ["geo.mandala", "part.embers", "spec.circle", "tunnel.warp"],
    groove: ["tunnel.hex", "laser.circle", "geo.terrain", "tunnel.rings", "laser.matrix"],
    chorus: ["laser.stadium", "geo.terrain", "laser.fan"],
    outro: ["part.starfield", "tunnel.rings"],
  },
  accents: {
    drop: ["part.shockwave", "part.sparks", "spec.bars"],
    chorus: ["part.confetti", "part.sparks"],
    build: ["part.sparks"],
  },
  camera: {
    intro: "cam.drift", build: "cam.push", drop: "cam.shake",
    breakdown: "cam.orbit", groove: "cam.bassZoom", chorus: "cam.bassZoom", outro: "cam.drift",
  },
  intensity: { intro: 0.4, build: 0.7, drop: 1.0, breakdown: 0.45, groove: 0.7, chorus: 0.85, outro: 0.35 },
};

function generateShow(project, analysis) {
  const tracks = Object.fromEntries(project.tracks.map(tr => [tr.name, tr]));
  const bg = tracks["Background"], main = tracks["Main"], acc = tracks["Accents"];
  const fx = tracks["FX / Colour"], cam = tracks["Camera"], trans = tracks["Transitions"];

  // clear only director-owned clips (the §9.8 contract)
  for (const tr of project.tracks) tr.clips = tr.clips.filter(c => !c.auto);

  const pick = (pool, rnd) => pool[Math.floor(rnd() * pool.length) % pool.length];

  analysis.sections.forEach((sec, i) => {
    const rnd = prng(project.seed * 7919 + i * 131);
    const type = POOLS.main[sec.type] ? sec.type : "groove";
    const intensity = POOLS.intensity[type];
    const opts = { auto: true, seed: project.seed * 100 + i };

    if (bg) bg.clips.push(makeClip(pick(POOLS.background[type], rnd), sec.start, sec.end,
      { intensity: intensity * 0.8 }, { ...opts, fadeIn: 0.4, fadeOut: 0.4 }));

    if (main) main.clips.push(makeClip(pick(POOLS.main[type], rnd), sec.start, sec.end,
      { intensity }, { ...opts, fadeIn: 0.25, fadeOut: 0.25 }));

    if (acc && POOLS.accents[type]) {
      acc.clips.push(makeClip(pick(POOLS.accents[type], rnd), sec.start, sec.end,
        { intensity: intensity * 0.9 }, opts));
    }

    if (cam) cam.clips.push(makeClip(POOLS.camera[type], sec.start, sec.end, {}, opts));

    if (fx) {
      // palette per section (kept from V1 Auto Show)
      const pals = AUTO_PALETTES[type] || AUTO_PALETTES.groove;
      const palette = pals[i % pals.length];
      fx.clips.push(makeClip("fx.palette", sec.start, sec.end, { palette }, opts));
      if (type === "drop") {
        fx.clips.push(makeClip("fx.strobe", sec.start, sec.end, { amount: 0.65 }, opts));
        fx.clips.push(makeClip("fx.rgbsplit", sec.start, sec.end, { shift: 5, intensity: 0.6 }, opts));
      }
      if (type === "build") {
        const buildFx = makeClip("fx.rgbsplit", sec.start, sec.end, { shift: 2 }, opts);
        buildFx.mods = [{ param: "shift", source: "buildProgress", amount: 0.5, attackMs: 0, releaseMs: 100, bypass: false }];
        fx.clips.push(buildFx);
      }
    }

    // transition flash at every section start except t=0 (kept from V1)
    if (trans && sec.start > 0.01) {
      trans.clips.push(makeClip(sec.type === "drop" ? "trans.flash" : "trans.flash",
        sec.start - 0.15, sec.start + 0.45, { peak: sec.type === "drop" ? 1 : 0.7 }, opts));
    }
  });

  for (const tr of project.tracks) sortTrack(tr);
}

// ===== js/core/playback.js =====
// Shared playback clock (desktop + mobile shells). Plays the source
// AudioBuffer; its `t` is the time every render reads.

class Playback {
  constructor() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gain = this.ctx.createGain();
    this.gain.connect(this.ctx.destination);
    this.streamDest = this.ctx.createMediaStreamDestination();
    this.gain.connect(this.streamDest);
    this.buffer = null; this.source = null;
    this.playing = false; this.startedAt = 0; this.offset = 0;
    this.onEnded = null;
  }
  get duration() { return this.buffer ? this.buffer.duration : 0; }
  get t() {
    if (!this.buffer) return 0;
    return this.playing ? Math.min(this.offset + this.ctx.currentTime - this.startedAt, this.duration) : this.offset;
  }
  play() {
    if (!this.buffer || this.playing) return;
    this.ctx.resume();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.connect(this.gain);
    this.source.onended = () => {
      if (this.playing && this.t >= this.duration - 0.05) {
        this.playing = false; this.offset = 0;
        if (this.onEnded) this.onEnded();
      }
    };
    this.source.start(0, this.offset);
    this.startedAt = this.ctx.currentTime;
    this.playing = true;
  }
  pause() { if (!this.playing) return; this.offset = this.t; this._kill(); this.playing = false; }
  seek(t) {
    const was = this.playing;
    if (was) this._kill();
    this.playing = false;
    this.offset = Math.max(0, Math.min(t, this.duration));
    if (was) this.play();
  }
  _kill() {
    if (this.source) {
      this.source.onended = null;
      try { this.source.stop(); } catch (e) { /* noop */ }
      this.source.disconnect(); this.source = null;
    }
  }
}

// ===== js/export/mp4muxer.js =====
// Minimal ISO-BMFF (MP4) muxer for WebCodecs output (spec §13).
// Supports: one H.264 (avc1) video track + optional AAC (mp4a) or Opus
// audio track. Layout: ftyp | mdat (video samples, then audio samples) |
// moov. One chunk per track keeps the sample tables trivial and valid.

// ---- byte writer ----
class W {
  constructor() { this.parts = []; this.len = 0; }
  bytes(b) { this.parts.push(b); this.len += b.length; return this; }
  u8(v) { return this.bytes(new Uint8Array([v & 0xff])); }
  u16(v) { return this.bytes(new Uint8Array([(v >> 8) & 0xff, v & 0xff])); }
  u24(v) { return this.bytes(new Uint8Array([(v >> 16) & 0xff, (v >> 8) & 0xff, v & 0xff])); }
  u32(v) { return this.bytes(new Uint8Array([(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff])); }
  u64(v) { this.u32(Math.floor(v / 4294967296)); return this.u32(v >>> 0); }
  str(s) { return this.bytes(new TextEncoder().encode(s)); }
  out() {
    const buf = new Uint8Array(this.len);
    let o = 0;
    for (const p of this.parts) { buf.set(p, o); o += p.length; }
    return buf;
  }
}

function box(type, ...children) {
  const w = new W();
  for (const c of children) w.bytes(c instanceof Uint8Array ? c : c.out());
  const body = w.out();
  const full = new W();
  full.u32(8 + body.length).str(type).bytes(body);
  return full.out();
}
const fullBox = (type, version, flags, body) => {
  const w = new W();
  w.u8(version).u24(flags).bytes(body.out());
  return box(type, w.out());
};

// build stts (decode deltas) from per-sample durations in timescale units
function stts(durations) {
  const runs = [];
  for (const d of durations) {
    if (runs.length && runs[runs.length - 1].d === d) runs[runs.length - 1].n++;
    else runs.push({ d, n: 1 });
  }
  const b = new W();
  b.u32(runs.length);
  for (const r of runs) b.u32(r.n).u32(r.d);
  return fullBox("stts", 0, 0, b);
}

function stsz(sizes) {
  const b = new W();
  b.u32(0).u32(sizes.length);
  for (const s of sizes) b.u32(s);
  return fullBox("stsz", 0, 0, b);
}

function stblCommon(sampleEntry, durations, sizes, chunkOffset, keyframes) {
  const stsc = (() => { const b = new W(); b.u32(1).u32(1).u32(sizes.length).u32(1); return fullBox("stsc", 0, 0, b); })();
  const stco = (() => { const b = new W(); b.u32(1).u32(chunkOffset); return fullBox("stco", 0, 0, b); })();
  const stsd = (() => { const b = new W(); b.u32(1); b.bytes(sampleEntry); return fullBox("stsd", 0, 0, b); })();
  const children = [stsd, stts(durations), stsc, stsz(sizes), stco];
  if (keyframes && keyframes.length && keyframes.length < sizes.length) {
    const b = new W();
    b.u32(keyframes.length);
    for (const k of keyframes) b.u32(k + 1);   // 1-indexed
    children.push(fullBox("stss", 0, 0, b));
  }
  return box("stbl", ...children);
}

function tkhd(id, durationMvhd, w, h, isAudio) {
  const b = new W();
  b.u32(0).u32(0).u32(id).u32(0).u32(durationMvhd);
  b.u32(0).u32(0).u16(0).u16(0);
  b.u16(isAudio ? 0x0100 : 0).u16(0);
  // identity matrix
  b.u32(0x00010000).u32(0).u32(0).u32(0).u32(0x00010000).u32(0).u32(0).u32(0).u32(0x40000000);
  b.u32((w || 0) << 16).u32((h || 0) << 16);
  return fullBox("tkhd", 0, 3, b);
}

function mdhd(timescale, duration) {
  const b = new W();
  b.u32(0).u32(0).u32(timescale).u32(duration).u16(0x55c4).u16(0);
  return fullBox("mdhd", 0, 0, b);
}

function hdlr(type, name) {
  const b = new W();
  b.u32(0).str(type).u32(0).u32(0).u32(0).str(name).u8(0);
  return fullBox("hdlr", 0, 0, b);
}

const dinf = () => box("dinf", fullBox("dref", 0, 0, (() => {
  const b = new W();
  b.u32(1);
  b.bytes(fullBox("url ", 0, 1, new W()));
  return b;
})()));

function visualSampleEntryHeader(w, h) {
  const b = new W();
  b.bytes(new Uint8Array(6)).u16(1);                    // reserved + data_ref
  b.u16(0).u16(0).u32(0).u32(0).u32(0);                 // pre_defined/reserved
  b.u16(w).u16(h).u32(0x00480000).u32(0x00480000);      // 72 dpi
  b.u32(0).u16(1);                                      // frame_count
  b.bytes(new Uint8Array(32));                          // compressorname
  b.u16(0x0018).u16(0xffff);                            // depth, pre_defined
  return b.out();
}

function avc1Entry(w, h, avcC) {
  const entry = new W();
  entry.bytes(visualSampleEntryHeader(w, h)).bytes(box("avcC", new Uint8Array(avcC)));
  return box("avc1", entry.out());
}

function vp09Entry(w, h) {
  // vpcC: version 1, profile 0, level 41, 8-bit 4:2:0, BT.709
  const v = new W();
  v.u8(0).u8(41).u8((8 << 4) | (1 << 1) | 0);           // profile, level, depth|subsampling|fullrange
  v.u8(1).u8(1).u8(1);                                  // primaries, transfer, matrix
  v.u16(0);                                             // codecInitializationDataSize
  const entry = new W();
  entry.bytes(visualSampleEntryHeader(w, h)).bytes(fullBox("vpcC", 1, 0, v));
  return box("vp09", entry.out());
}

function esdsDescriptor(asc, avgBitrate) {
  const d = new W();
  d.u8(0x03).u8(23 + asc.length);                       // ES_Descriptor
  d.u16(1).u8(0);
  d.u8(0x04).u8(15 + asc.length);                       // DecoderConfig
  d.u8(0x40).u8(0x15).u24(0).u32(avgBitrate).u32(avgBitrate);
  d.u8(0x05).u8(asc.length).bytes(new Uint8Array(asc)); // DecSpecificInfo
  d.u8(0x06).u8(1).u8(0x02);                            // SLConfig
  const b = new W();
  b.u32(0).bytes(d.out());
  return box("esds", b.out());
}

function audioEntry(codec, channels, sampleRate, description, avgBitrate) {
  const b = new W();
  b.bytes(new Uint8Array(6)).u16(1);
  b.u32(0).u32(0);
  b.u16(channels).u16(16).u16(0).u16(0);
  b.u32(sampleRate << 16);
  const entry = new W();
  entry.bytes(b.out());
  if (codec === "aac") {
    entry.bytes(esdsDescriptor(description || [0x12, 0x10], avgBitrate));
    return box("mp4a", entry.out());
  }
  // Opus: dOps box (values big-endian, from OpusHead if provided)
  let preSkip = 3840, gain = 0;
  if (description && description.length >= 19) {         // OpusHead layout (LE)
    const d = new Uint8Array(description);
    preSkip = d[10] | (d[11] << 8);
    gain = d[16] | (d[17] << 8);
  }
  const dops = new W();
  dops.u8(0).u8(channels).u16(preSkip).u32(sampleRate).u16(gain).u8(0);
  entry.bytes(box("dOps", dops.out()));
  return box("Opus", entry.out());
}

// samples: [{ data: Uint8Array, duration (timescale units), key: bool }]
function muxMP4({ video, audio }) {
  const videoBytes = video.samples.reduce((s, x) => s + x.data.length, 0);
  const audioBytes = audio ? audio.samples.reduce((s, x) => s + x.data.length, 0) : 0;

  const ftyp = (() => {
    const b = new W();
    b.str("isom").u32(512).str("isom").str("iso2").str("avc1").str("mp41");
    return box("ftyp", b.out());
  })();

  const mdatHeader = 8;
  const mdatStart = ftyp.length;
  const videoOffset = mdatStart + mdatHeader;
  const audioOffset = videoOffset + videoBytes;

  const mdat = new W();
  mdat.u32(mdatHeader + videoBytes + audioBytes).str("mdat");
  for (const s of video.samples) mdat.bytes(s.data);
  if (audio) for (const s of audio.samples) mdat.bytes(s.data);

  const vDur = video.samples.reduce((s, x) => s + x.duration, 0);
  const movieDurMs = Math.round(vDur / video.timescale * 1000);

  const mvhd = (() => {
    const b = new W();
    b.u32(0).u32(0).u32(1000).u32(movieDurMs);
    b.u32(0x00010000).u16(0x0100).u16(0).u32(0).u32(0);
    b.u32(0x00010000).u32(0).u32(0).u32(0).u32(0x00010000).u32(0).u32(0).u32(0).u32(0x40000000);
    b.bytes(new Uint8Array(24));    // pre_defined
    b.u32(audio ? 3 : 2);           // next_track_ID
    return fullBox("mvhd", 0, 0, b);
  })();

  const vTrak = box("trak",
    tkhd(1, movieDurMs, video.width, video.height, false),
    box("mdia",
      mdhd(video.timescale, vDur),
      hdlr("vide", "Poopdog Video"),
      box("minf",
        fullBox("vmhd", 0, 1, (() => { const b = new W(); b.u16(0).u16(0).u16(0).u16(0); return b; })()),
        dinf(),
        stblCommon(
          video.codec === "vp9" ? vp09Entry(video.width, video.height)
            : avc1Entry(video.width, video.height, video.avcC),
          video.samples.map(s => s.duration),
          video.samples.map(s => s.data.length),
          videoOffset,
          video.samples.map((s, i) => s.key ? i : -1).filter(i => i >= 0),
        ))));

  let aTrak = null;
  if (audio) {
    const aDur = audio.samples.reduce((s, x) => s + x.duration, 0);
    aTrak = box("trak",
      tkhd(2, movieDurMs, 0, 0, true),
      box("mdia",
        mdhd(audio.timescale, aDur),
        hdlr("soun", "Poopdog Audio"),
        box("minf",
          fullBox("smhd", 0, 0, (() => { const b = new W(); b.u16(0).u16(0); return b; })()),
          dinf(),
          stblCommon(
            audioEntry(audio.codec, audio.channels, audio.sampleRate, audio.description, audio.avgBitrate || 128000),
            audio.samples.map(s => s.duration),
            audio.samples.map(s => s.data.length),
            audioOffset,
            null,
          ))));
  }

  const moov = aTrak ? box("moov", mvhd, vTrak, aTrak) : box("moov", mvhd, vTrak);

  const out = new W();
  out.bytes(ftyp).bytes(mdat.out()).bytes(moov);
  return new Blob([out.out()], { type: "video/mp4" });
}

// ===== js/export/exporter.js =====
// Offline deterministic exporter (spec §13.4). Fixed-timestep re-render of
// the project through the same engine as preview — never a capture of
// playback. Video: WebCodecs H.264 -> minimal MP4 muxer. Audio: AAC when
// the platform encoder exists, else Opus-in-MP4.


function avcCodecString(w, h, fps) {
  // main profile; level by pixel rate
  const mbs = Math.ceil(w / 16) * Math.ceil(h / 16) * fps;
  if (mbs > 245760 || w >= 3000) return "avc1.640033";   // high 5.1 (4K)
  if (mbs > 108000) return "avc1.4d0029";                // main 4.1
  return "avc1.4d001f";                                  // main 3.1
}

async function exportMP4({ engine, project, analysis, audioBuffer, width, height, fps, quality, durationS, onProgress, shouldCancel }) {
  if (typeof VideoEncoder === "undefined") {
    throw new Error("WebCodecs is not available — use the WebM fallback format.");
  }
  const totalFrames = Math.ceil(durationS * fps);
  const timescale = fps * 1000, frameDelta = 1000;

  const canvas = new OffscreenCanvas(width, height);
  const ctx = canvas.getContext("2d");

  // ---- video encoder ----
  const bitrate = Math.round((width * height * fps) / 30 * (0.06 + quality / 100 * 0.22));
  const videoSamples = [];
  let avcC = null;
  let encodeError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) {
        avcC = new Uint8Array(meta.decoderConfig.description);
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      videoSamples.push({ data, duration: frameDelta, key: chunk.type === "key" });
    },
    error: e => { encodeError = e; },
  });
  // H.264 first (the §13 default); VP9-in-MP4 fallback for Chromium builds
  // without proprietary encoders. Codec is reported back to the UI.
  let videoCodec = "avc";
  let cfg = {
    codec: avcCodecString(width, height, fps), width, height, framerate: fps,
    bitrate, avc: { format: "avc" }, latencyMode: "quality",
  };
  let support = await VideoEncoder.isConfigSupported(cfg).catch(() => ({ supported: false }));
  if (!support.supported) {
    videoCodec = "vp9";
    cfg = { codec: "vp09.00.41.08", width, height, framerate: fps, bitrate, latencyMode: "quality" };
    support = await VideoEncoder.isConfigSupported(cfg).catch(() => ({ supported: false }));
  }
  if (!support.supported) throw new Error("No supported video encoder (tried H.264, VP9).");
  encoder.configure(cfg);

  // ---- render + encode loop (fixed timestep) ----
  const t0 = performance.now();
  for (let i = 0; i < totalFrames; i++) {
    if (shouldCancel && shouldCancel()) { encoder.close(); throw new Error("cancelled"); }
    if (encodeError) throw encodeError;
    const t = i / fps;
    engine.render(project, analysis, t, ctx, width, height);
    const frame = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps) });
    encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
    frame.close();
    if (encoder.encodeQueueSize > 6) {
      await new Promise(r => { encoder.addEventListener("dequeue", r, { once: true }); });
    }
    if (onProgress && (i & 7) === 0) {
      const elapsed = (performance.now() - t0) / 1000;
      onProgress({ frame: i, total: totalFrames, fps: i / Math.max(0.001, elapsed), stage: "video" });
    }
    if ((i & 31) === 0) await new Promise(r => setTimeout(r, 0));
  }
  await encoder.flush();
  encoder.close();
  if (encodeError) throw encodeError;

  // ---- audio ----
  let audioTrack = null;
  try {
    audioTrack = await encodeAudio(audioBuffer, durationS, onProgress);
  } catch (e) {
    console.warn("Audio encode failed, exporting video-only MP4:", e);
  }

  if (onProgress) onProgress({ frame: totalFrames, total: totalFrames, fps: 0, stage: "mux" });
  return {
    blob: muxMP4({
      video: { samples: videoSamples, timescale, width, height, avcC, codec: videoCodec },
      audio: audioTrack,
    }),
    videoCodec,
    audioCodec: audioTrack ? audioTrack.codec : "none",
  };
}

async function encodeAudio(audioBuffer, durationS, onProgress) {
  if (!audioBuffer || typeof AudioEncoder === "undefined") return null;

  // resample to 48k stereo so both AAC and Opus are happy
  const RATE = 48000, CH = 2;
  const frames = Math.min(Math.ceil(durationS * RATE), Math.ceil(audioBuffer.duration * RATE));
  const oac = new OfflineAudioContext(CH, frames, RATE);
  const src = oac.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(oac.destination);
  src.start();
  const resampled = await oac.startRendering();

  // prefer AAC, fall back to Opus
  let codec = "aac", codecString = "mp4a.40.2";
  let sup = await AudioEncoder.isConfigSupported({ codec: codecString, sampleRate: RATE, numberOfChannels: CH, bitrate: 192000 })
    .catch(() => ({ supported: false }));
  if (!sup.supported) {
    codec = "opus"; codecString = "opus";
    sup = await AudioEncoder.isConfigSupported({ codec: "opus", sampleRate: RATE, numberOfChannels: CH, bitrate: 160000 })
      .catch(() => ({ supported: false }));
    if (!sup.supported) return null;
  }

  const samples = [];
  let description = null, err = null;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) {
        description = new Uint8Array(meta.decoderConfig.description);
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      // duration comes back in µs; convert to timescale (= sample rate) units
      samples.push({ data, duration: Math.round((chunk.duration || 21333) * RATE / 1e6), key: true });
    },
    error: e => { err = e; },
  });
  enc.configure({ codec: codecString, sampleRate: RATE, numberOfChannels: CH, bitrate: codec === "aac" ? 192000 : 160000 });

  const CHUNK = 4800;   // 100ms per AudioData
  const planes = [resampled.getChannelData(0), resampled.getChannelData(1)];
  for (let off = 0; off < frames; off += CHUNK) {
    const n = Math.min(CHUNK, frames - off);
    const buf = new Float32Array(n * CH);           // f32-planar: plane 0 then plane 1
    buf.set(planes[0].subarray(off, off + n), 0);
    buf.set(planes[1].subarray(off, off + n), n);
    enc.encode(new AudioData({
      format: "f32-planar", sampleRate: RATE, numberOfFrames: n,
      numberOfChannels: CH, timestamp: Math.round(off * 1e6 / RATE), data: buf,
    }));
    if (err) throw err;
  }
  await enc.flush();
  enc.close();
  if (err) throw err;

  return { samples, timescale: RATE, sampleRate: RATE, channels: CH, codec, description, avgBitrate: codec === "aac" ? 192000 : 160000 };
}

// Legacy fallback (V1 path): realtime capture to WebM. Kept only for
// engines without WebCodecs; clearly labelled in the UI.
function exportWebM({ canvas, audioEngine, onDone }) {
  const stream = new MediaStream([
    ...canvas.captureStream(60).getVideoTracks(),
    ...audioEngine.streamDest.stream.getAudioTracks(),
  ]);
  const mime = ["video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  const chunks = [];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => onDone(new Blob(chunks, { type: "video/webm" }));
  rec.start(250);
  return rec;
}

// ===== mobile shell =====

// ===== Poopdog V2 mobile shell — imports the real V2 core modules =====

const $ = id => document.getElementById(id);
const stage = $("stage");
const ctx = stage.getContext("2d");
const engine = makeEngine();
const playback = new Playback();

let project = null, analysis = null, audioBuffer = null;
let cancelExport = false, exporting = false;

function toast(msg, ms = 3200) {
  const el = $("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, ms);
}

// canvas sized to viewport, dpr-capped for mobile GPUs
function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  stage.width = Math.round(innerWidth * dpr);
  stage.height = Math.round(innerHeight * dpr);
}
fit();
addEventListener("resize", () => { fit(); drawScrub(); });

// palette override select (empty = follow the Director's palette clips)
for (const [k, p] of Object.entries(PALETTES)) $("s-pal").add(new Option("Palette: " + p.label, k));

// ---- import -> analyse -> generate (the golden path, §4.9) ----
$("b-open").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ""; });

async function load(file) {
  $("start").hidden = true;
  $("busy").hidden = false;
  $("busy-msg").textContent = "Decoding…";
  try {
    const ab = await file.arrayBuffer();
    audioBuffer = await playback.ctx.decodeAudioData(ab);
    playback.buffer = audioBuffer;
    analysis = await analyze(audioBuffer, m => { $("busy-msg").textContent = m; });

    project = makeProject(file.name.replace(/\.[^.]+$/, ""));
    project.audioName = file.name;
    project.tracks = defaultTracks();
    generateShow(project, analysis);

    $("h-bpm").textContent = analysis.bpm + " BPM";
    $("busy").hidden = true;
    $("hud").hidden = false; $("ui").hidden = false; $("hint").hidden = false;
    setTimeout(() => { $("hint").style.opacity = 0; }, 4000);
    drawScrub();
    playback.play();
    $("b-play").textContent = "⏸";
  } catch (err) {
    $("busy").hidden = true;
    $("start").hidden = false;
    toast("Could not load: " + err.message, 5000);
  }
}

// ---- transport ----
$("b-play").addEventListener("click", () => {
  if (!playback.buffer) return;
  if (playback.playing) { playback.pause(); $("b-play").textContent = "▶"; }
  else { playback.play(); $("b-play").textContent = "⏸"; }
});
playback.onEnded = () => { $("b-play").textContent = "▶"; };

// ⚡ new show: reroll the Director seed (determinism law: same seed = same show)
$("b-regen").addEventListener("click", () => {
  if (!project) return;
  project.seed = (project.seed % 9999) + 1;
  generateShow(project, analysis);
  toast(`New show — seed ${project.seed}`);
  drawScrub();
});

// palette override rides on the project default; Director palette clips
// still win while active, so "" removes them for a manual global palette
$("s-pal").addEventListener("change", e => {
  if (!project) return;
  const v = e.target.value;
  const fx = project.tracks.find(t => t.name === "FX / Colour");
  if (v) {
    if (!fx._savedPalettes) fx._savedPalettes = fx.clips.filter(c => c.gen === "fx.palette");
    fx.clips = fx.clips.filter(c => c.gen !== "fx.palette");
    project.palette = v;
  } else if (fx._savedPalettes) {
    fx.clips.push(...fx._savedPalettes);
    fx.clips.sort((a, b) => a.start - b.start);
    fx._savedPalettes = null;
  }
});

// tap visuals to tuck/show controls
stage.addEventListener("pointerdown", () => {
  if (!project) return;
  $("ui").classList.toggle("tucked");
  $("hud").style.opacity = $("ui").classList.contains("tucked") ? 0 : 1;
});

// ---- scrubber: V1 navigator strip on the V2 analysis ----
const scrub = $("scrub");
function drawScrub() {
  if (!analysis) return;
  const r = scrub.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  scrub.width = r.width * dpr; scrub.height = 34 * dpr;
  const c = scrub.getContext("2d"), w = scrub.width, h = scrub.height;
  c.clearRect(0, 0, w, h);
  const D = analysis.duration;
  for (const s of analysis.sections) {
    c.fillStyle = SECTION_COLORS[s.type] || "#444";
    c.globalAlpha = .55;
    c.fillRect(s.start / D * w, 0, (s.end - s.start) / D * w, h);
  }
  c.globalAlpha = 1;
  c.strokeStyle = "rgba(255,255,255,.9)";
  c.lineWidth = dpr;
  c.beginPath();
  const E = analysis.curves.energy;
  for (let x = 0; x < w; x += 2) {
    const y = h - E[Math.min(E.length - 1, (x / w * E.length) | 0)] * (h - 4) - 2;
    x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.stroke();
}
scrub.addEventListener("pointerdown", e => {
  if (!playback.buffer) return;
  const r = scrub.getBoundingClientRect();
  playback.seek((e.clientX - r.left) / r.width * playback.duration);
  if (playback.playing) $("b-play").textContent = "⏸";
});

// ---- export: the V2 offline deterministic MP4 path ----
$("b-export").addEventListener("click", async () => {
  if (!project) return;
  if (exporting) { cancelExport = true; return; }
  const [width, height] = $("s-res").value.split("x").map(Number);
  exporting = true; cancelExport = false;
  playback.pause(); $("b-play").textContent = "▶";
  $("busy").hidden = false;
  $("busy").querySelector(".bar").hidden = false;
  $("busy-cancel").hidden = false;
  $("busy-cancel").onclick = () => { cancelExport = true; };
  $("b-export").classList.add("busy");
  try {
    if (typeof VideoEncoder === "undefined") throw new Error("no-webcodecs");
    const { blob, videoCodec, audioCodec } = await exportMP4({
      engine, project, analysis, audioBuffer,
      width, height, fps: 30, quality: 70, durationS: playback.duration,
      shouldCancel: () => cancelExport,
      onProgress: p => {
        $("busy-fill").style.width = (p.frame / p.total * 100) + "%";
        $("busy-msg").textContent = p.stage === "mux" ? "Muxing…"
          : `Rendering ${p.frame}/${p.total} · ${p.fps.toFixed(0)} fps`;
      },
    });
    save(blob, `${project.name}.mp4`);
    toast(`MP4 saved — ${(blob.size / 1e6).toFixed(1)} MB (${videoCodec === "avc" ? "H.264" : "VP9"} + ${audioCodec})`, 5000);
  } catch (err) {
    if (err.message === "cancelled") toast("Export cancelled");
    else if (err.message === "no-webcodecs") await webmFallback();
    else toast("Export failed: " + err.message, 5000);
  }
  $("busy").hidden = true;
  $("busy").querySelector(".bar").hidden = true;
  $("busy-cancel").hidden = true;
  $("b-export").classList.remove("busy");
  exporting = false;
});

// realtime WebM capture for browsers without WebCodecs (older iOS)
function webmFallback() {
  return new Promise(resolve => {
    toast("No MP4 encoder here — recording WebM in realtime");
    playback.seek(0); playback.play();
    const rec = exportWebM({
      canvas: stage, audioEngine: playback,
      onDone: blob => { save(blob, `${project.name}.webm`); resolve(); },
    });
    (function watch() {
      $("busy-fill").style.width = (playback.t / playback.duration * 100) + "%";
      $("busy-msg").textContent = `Recording ${playback.t.toFixed(0)}s / ${playback.duration.toFixed(0)}s`;
      if (playback.playing && !cancelExport) requestAnimationFrame(watch);
      else { playback.pause(); rec.stop(); }
    })();
  });
}

function save(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// ---- render loop: same engine.render as desktop preview and export ----
function frame() {
  requestAnimationFrame(frame);
  if (!project) return;
  const t = playback.t;
  engine.render(project, analysis, t, ctx, stage.width, stage.height);
  const sec = analysis ? sectionAt(analysis.sections, t) : null;
  $("h-sec").textContent = sec ? (SECTION_LABELS[sec.type] || sec.type) : "—";
}
frame();

// expose for tests
window.__poopdog = { get project() { return project; }, get analysis() { return analysis; }, playback, engine };
window.__poopdogBooted = true;

})();
</script>
