<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Poopdog V2 Mobile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --accent: #c8ff00; --panel: rgba(14,14,22,.93); --dim: #8888a0; }
html, body { height: 100%; overflow: hidden; background: #000; color: #e8e8f0; font-family: system-ui, sans-serif; }
body { touch-action: none; }
button { font-family: inherit; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#start {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(ellipse at center, #14141f 0%, #060609 100%);
  text-align: center; padding: 24px;
}
#start[hidden] { display: none; }
#start .icon { font-size: 52px; }
#start h1 { font-size: 21px; letter-spacing: 2px; }
#start h1 b { color: var(--accent); }
#start p { color: var(--dim); font-size: 13px; line-height: 1.5; }
#start button {
  margin-top: 8px; padding: 14px 30px; font-size: 16px; font-weight: 700;
  background: var(--accent); color: #000; border: 0; border-radius: 999px;
}
#start .v2tag { font-size: 10px; letter-spacing: 3px; color: var(--dim); }

#busy {
  position: fixed; inset: 0; z-index: 11; background: rgba(4,4,8,.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
#busy[hidden] { display: none; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #2a2a3c; border-top-color: var(--accent); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
#busy-msg { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
#busy .bar { width: 70%; height: 6px; background: #22222f; border-radius: 3px; overflow: hidden; }
#busy .bar[hidden] { display: none; }
#busy-fill { height: 100%; width: 0; background: var(--accent); }
#busy-cancel { background: #22222f; color: #e8e8f0; border: 0; border-radius: 8px; padding: 9px 22px; }
#busy-cancel[hidden] { display: none; }

#hud {
  position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px; z-index: 5;
  font-size: 11px; letter-spacing: 1px; background: rgba(0,0,0,.5);
  padding: 5px 10px; border-radius: 999px; pointer-events: none; transition: opacity .3s;
}
#hud b { color: var(--accent); }
#hud[hidden] { display: none; }

#ui {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--panel); backdrop-filter: blur(8px);
  padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
  transition: transform .25s, opacity .25s;
}
#ui[hidden] { display: none; }
#ui.tucked { transform: translateY(100%); opacity: 0; pointer-events: none; }
#scrub { width: 100%; height: 34px; display: block; border-radius: 6px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
button.ctl {
  background: #22222f; color: #e8e8f0; border: 0; border-radius: 10px;
  padding: 11px 0; font-size: 14px; flex: 1;
}
button.ctl:active { background: #33334a; }
#b-play { flex: 0 0 54px; font-size: 17px; background: var(--accent); color: #000; font-weight: 700; }
#b-regen { font-weight: 700; }
#b-export.busy { background: #ff3030; color: #fff; }
select {
  flex: 1; background: #22222f; color: #e8e8f0; border: 0; border-radius: 10px;
  padding: 10px 8px; font-size: 13px; appearance: none; text-align: center;
}
#hint {
  position: fixed; bottom: calc(env(safe-area-inset-bottom) + 8px); left: 0; right: 0; z-index: 4;
  text-align: center; font-size: 11px; color: rgba(255,255,255,.45); pointer-events: none; transition: opacity .4s;
}
#toast {
  position: fixed; top: calc(env(safe-area-inset-top) + 52px); left: 50%; transform: translateX(-50%);
  z-index: 50; background: #1a1a26; border: 1px solid #2e2e44; padding: 9px 16px; border-radius: 8px;
  font-size: 12px; max-width: 88vw;
}
#toast[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="start">
  <div class="icon">🌀</div>
  <h1><b>POOPDOG</b> RAVE ENGINE</h1>
  <div class="v2tag">V2 MOBILE · SAME ENGINE AS DESKTOP</div>
  <p>Pick a DJ mix — BPM, beats, drops &amp; energy are detected,<br>
     then the Director generates a full show. Export real MP4.</p>
  <button id="b-open">Pick audio file</button>
  <input type="file" id="file" accept="audio/*" hidden>
</div>

<div id="busy" hidden>
  <div class="spin"></div>
  <div id="busy-msg">Analysing…</div>
  <div class="bar" hidden><div id="busy-fill"></div></div>
  <button id="busy-cancel" hidden>Cancel</button>
</div>

<div id="hud" hidden><b id="h-bpm">—</b> · <span id="h-sec">—</span></div>
<div id="hint" hidden>tap visuals to hide controls</div>

<div id="ui" hidden>
  <canvas id="scrub"></canvas>
  <div class="row">
    <button class="ctl" id="b-play">▶</button>
    <button class="ctl" id="b-regen">⚡ New show</button>
    <button class="ctl" id="b-export">⏺ MP4</button>
  </div>
  <div class="row">
    <select id="s-pal"><option value="">Palette: Director</option></select>
    <select id="s-res">
      <option value="720x1280" selected>Export: vertical 720p</option>
      <option value="1280x720">Export: landscape 720p</option>
      <option value="1080x1920">Export: vertical 1080p</option>
    </select>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(function () {
"use strict";
// ===== js/core/prng.js =====
// Seeded deterministic PRNG (mulberry32). The determinism law (spec §3):
// every random visual decision flows from a seed stored in the project.

function prng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Stable per-(seed, index) value without consuming a stream — lets a
// generator ask "random value #k for particle #i" at any time t.
function hash01(seed, i) {
  let h = (seed ^ (i * 0x9E3779B9)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x21f0aaad) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x735a2d97) >>> 0;
  return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
}

// ===== js/core/palettes.js =====
// Colour palettes (kept from V1 — spec §6.10). [h, s, l] per slot.

const PALETTES = {
  cyberpunk: { label: "Cyberpunk", colors: [[315,100,60],[185,100,55],[265,100,65],[55,100,60]], strobe: [185,100,85], bg: [255,60,4] },
  synthwave: { label: "Synthwave", colors: [[300,100,62],[200,100,60],[260,90,62],[330,100,65]], strobe: [300,100,88], bg: [270,55,5] },
  hardstyle: { label: "Hardstyle", colors: [[0,100,55],[45,100,55],[0,0,95],[15,100,60]], strobe: [0,0,100], bg: [0,45,4] },
  techno:    { label: "Techno", colors: [[0,0,92],[210,15,70],[0,0,60],[200,30,80]], strobe: [0,0,100], bg: [220,15,3] },
  psytrance: { label: "Psytrance", colors: [[120,100,55],[280,100,60],[30,100,55],[180,100,55]], strobe: [120,100,85], bg: [280,50,4] },
  trance:    { label: "Trance", colors: [[210,100,60],[180,100,60],[240,90,65],[195,100,70]], strobe: [200,100,90], bg: [220,60,5] },
  dnb:       { label: "Drum & Bass", colors: [[25,100,55],[55,100,55],[0,90,55],[40,100,65]], strobe: [45,100,85], bg: [20,40,4] },
  acid:      { label: "Acid", colors: [[75,100,55],[60,100,50],[90,100,60],[50,100,55]], strobe: [70,100,85], bg: [90,50,3] },
  neon:      { label: "Neon", colors: [[320,100,60],[160,100,55],[45,100,58],[210,100,60]], strobe: [0,0,100], bg: [260,40,4] },
  blacklight:{ label: "Blacklight", colors: [[265,100,62],[285,100,58],[245,100,65],[300,90,60]], strobe: [270,100,88], bg: [265,70,4] },
};

function hsl(c, alpha = 1, lightBoost = 0, hueShift = 0) {
  return `hsla(${(c[0] + hueShift) % 360}, ${c[1]}%, ${Math.min(100, c[2] + lightBoost)}%, ${alpha})`;
}

// Section palette rotation kept from V1's Auto Show.
const AUTO_PALETTES = {
  drop: ["hardstyle", "neon", "cyberpunk", "acid"],
  build: ["synthwave", "trance"],
  breakdown: ["blacklight", "trance"],
  intro: ["techno"], outro: ["techno"],
  groove: ["cyberpunk", "psytrance", "dnb", "synthwave"],
  chorus: ["neon", "synthwave"],
};

const SECTION_LABELS = { intro: "Intro", build: "Build-up", drop: "DROP", breakdown: "Breakdown", groove: "Groove", chorus: "Chorus", outro: "Outro" };
const SECTION_COLORS = { intro: "#3a3a55", build: "#c8a000", drop: "#ff2d95", breakdown: "#2a7a8c", groove: "#5a5a8c", chorus: "#7a4fd0", outro: "#3a3a55" };
const SECTION_TYPES = ["intro", "build", "drop", "breakdown", "groove", "chorus", "outro"];

// ===== js/core/modulation.js =====
// Modulation system (spec §8). Pure functions of (analysis, t) — no state,
// so scrubbing, preview and offline render all agree.

const EVENT_SOURCES = ["kick", "snare", "hat", "beat", "bar", "drop"];
const CURVE_SOURCES = ["bass", "mid", "high", "energy", "loudness", "buildProgress"];
const ALL_SOURCES = [...EVENT_SOURCES, ...CURVE_SOURCES];

// Envelope for event sources: attack/release in ms around each event.
// Scans events near t (they're sorted); returns 0..1.
function eventEnv(events, t, attackMs, releaseMs) {
  const atk = attackMs / 1000, rel = releaseMs / 1000;
  let v = 0;
  // walk backwards from the latest event <= t + atk
  let lo = 0, hi = events.length;
  while (lo < hi) { const m = (lo + hi) >> 1; (events[m].t <= t + atk) ? lo = m + 1 : hi = m; }
  for (let i = lo - 1; i >= 0; i--) {
    const e = events[i], dt = t - e.t;
    if (dt > rel + atk) break;
    let env;
    if (dt < 0) env = 0;
    else if (dt < atk) env = dt / Math.max(atk, 1e-4);
    else env = Math.max(0, 1 - (dt - atk) / Math.max(rel, 1e-4));
    v = Math.max(v, env * (e.strength ?? 1));
  }
  return v;
}

function beatEvents(beats, t, releaseS) {
  // beats is a Float64Array of times; envelope decays over releaseS
  let lo = 0, hi = beats.length;
  while (lo < hi) { const m = (lo + hi) >> 1; (beats[m] <= t) ? lo = m + 1 : hi = m; }
  if (lo === 0) return 0;
  const dt = t - beats[lo - 1];
  return Math.max(0, 1 - dt / releaseS);
}

function curveAt(curve, frameDur, t) {
  const f = t / frameDur;
  const i = Math.floor(f);
  if (i < 0) return curve[0] ?? 0;
  if (i >= curve.length - 1) return curve[curve.length - 1] ?? 0;
  const fr = f - i;
  return curve[i] * (1 - fr) + curve[i + 1] * fr;
}

function sourceValue(analysis, source, t, attackMs = 0, releaseMs = 150) {
  if (!analysis) return 0;
  switch (source) {
    case "kick": return eventEnv(analysis.events.kick, t, attackMs, releaseMs);
    case "snare": return eventEnv(analysis.events.snare, t, attackMs, releaseMs);
    case "hat": return eventEnv(analysis.events.hat, t, attackMs, releaseMs);
    case "drop": return eventEnv(analysis.events.drop, t, attackMs, Math.max(releaseMs, 600));
    case "beat": return beatEvents(analysis.beats, t, Math.max(releaseMs, 60) / 1000);
    case "bar": return beatEvents(analysis.bars, t, Math.max(releaseMs, 120) / 1000);
    case "bass": return curveAt(analysis.curves.bass, analysis.frameDur, t);
    case "mid": return curveAt(analysis.curves.mid, analysis.frameDur, t);
    case "high": return curveAt(analysis.curves.high, analysis.frameDur, t);
    case "energy": return curveAt(analysis.curves.energy, analysis.frameDur, t);
    case "loudness": return curveAt(analysis.curves.loudness, analysis.frameDur, t);
    case "buildProgress": {
      const s = analysis.sections.find(x => t >= x.start && t < x.end);
      if (!s || s.type !== "build") return 0;
      return (t - s.start) / Math.max(0.001, s.end - s.start);
    }
    default: return 0;
  }
}

// slot: { param, source, amount (-1..1), attackMs, releaseMs }
// Base parameter values are normalised against the param's range by the
// caller; modulation adds amount*source of the range, clamped.
function applyMods(clip, analysis, t, key, base, min, max) {
  if (clip.mode === "manual" || !clip.mods) return base;
  let v = base;
  const range = max - min;
  for (const m of clip.mods) {
    if (m.param !== key || m.bypass) continue;
    const s = sourceValue(analysis, m.source, t, m.attackMs ?? 0, m.releaseMs ?? 150);
    v += m.amount * s * range * (clip.params.pulse ?? 1);
  }
  return Math.max(min, Math.min(max, v));
}

function makeSlot(param, source, amount = 0.5, attackMs = 0, releaseMs = 150) {
  return { param, source, amount, attackMs, releaseMs, bypass: false };
}

// ===== js/core/analysis.js =====
// Offline analysis service (spec §5). Pure: AudioBuffer -> Analysis.
// Everything downstream (director, modulation, render) reads only this,
// which is what makes preview and export bit-identical (§3 determinism).
//
// Analysis = {
//   sampleRate, duration, frameDur,          // frameDur = hop/sr (~11.6ms)
//   bpm, beats: Float64Array, bars: Float64Array,
//   curves: { bass, mid, high, energy, loudness },  // Float32Array per frame, 0..1
//   events: { kick, snare, hat, drop },      // [{t, strength}] sorted by t
//   sections: [{ start, end, type }],
//   waveform: Float32Array                   // ~2000 peak values for drawing
// }

const FFT_SIZE = 1024, HOP = 512;

// ---- radix-2 FFT (real input, magnitudes out) ----
function makeFFT(n) {
  const rev = new Uint32Array(n);
  for (let i = 0, j = 0; i < n; i++) {
    rev[i] = j;
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j |= bit;
  }
  const cos = new Float32Array(n / 2), sin = new Float32Array(n / 2);
  for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(-2 * Math.PI * i / n); sin[i] = Math.sin(-2 * Math.PI * i / n); }
  const re = new Float32Array(n), im = new Float32Array(n);
  return function fft(input, mags) {
    for (let i = 0; i < n; i++) { re[i] = input[rev[i]]; im[i] = 0; }
    for (let len = 2; len <= n; len <<= 1) {
      const half = len >> 1, step = n / len;
      for (let i = 0; i < n; i += len) {
        for (let j = 0; j < half; j++) {
          const k = j * step;
          const tr = re[i + j + half] * cos[k] - im[i + j + half] * sin[k];
          const ti = re[i + j + half] * sin[k] + im[i + j + half] * cos[k];
          re[i + j + half] = re[i + j] - tr; im[i + j + half] = im[i + j] - ti;
          re[i + j] += tr; im[i + j] += ti;
        }
      }
    }
    for (let i = 0; i < n / 2; i++) mags[i] = Math.hypot(re[i], im[i]) / n;
  };
}

async function analyze(buffer, onProgress) {
  const say = m => { if (onProgress) onProgress(m); };
  const sr = buffer.sampleRate, n = buffer.length;
  const mono = new Float32Array(n);
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += d[i] / buffer.numberOfChannels;
  }

  say("Computing spectrum…");
  const frames = Math.max(1, Math.floor((n - FFT_SIZE) / HOP));
  const frameDur = HOP / sr;
  const fft = makeFFT(FFT_SIZE);
  const window = new Float32Array(FFT_SIZE);
  for (let i = 0; i < FFT_SIZE; i++) window[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / FFT_SIZE);
  const binHz = sr / FFT_SIZE;
  const bin = hz => Math.max(0, Math.min(FFT_SIZE / 2 - 1, Math.round(hz / binHz)));

  const BANDS = {                       // V1 bands kept (§5.1)
    sub: [bin(30), bin(120)], lowmid: [bin(150), bin(400)],
    bass: [bin(30), bin(150)], mid: [bin(400), bin(2500)],
    high: [bin(4000), bin(12000)], veryhigh: [bin(6000), bin(14000)],
    full: [bin(30), bin(14000)],
  };
  const bandE = {};
  for (const k in BANDS) bandE[k] = new Float32Array(frames);

  const frame = new Float32Array(FFT_SIZE), mags = new Float32Array(FFT_SIZE / 2);
  for (let f = 0; f < frames; f++) {
    const off = f * HOP;
    for (let i = 0; i < FFT_SIZE; i++) frame[i] = mono[off + i] * window[i];
    fft(frame, mags);
    for (const k in BANDS) {
      const [lo, hi] = BANDS[k];
      let s = 0;
      for (let b = lo; b <= hi; b++) s += mags[b];
      bandE[k][f] = s / (hi - lo + 1);
    }
    if ((f & 2047) === 0) await tick();      // keep UI alive on long mixes
  }

  say("Detecting hits…");
  const flux = {};
  for (const k of ["sub", "lowmid", "veryhigh", "full"]) {
    flux[k] = new Float32Array(frames);
    for (let f = 1; f < frames; f++) flux[k][f] = Math.max(0, bandE[k][f] - bandE[k][f - 1]);
  }
  const kick = pickEvents(flux.sub, frameDur, 1.9, 0.16);
  const snare = pickEvents(flux.lowmid, frameDur, 2.2, 0.20);
  const hat = pickEvents(flux.veryhigh, frameDur, 2.0, 0.10);

  say("Detecting BPM…");
  const { bpm, beats, bars } = tempo(flux.full, frameDur, buffer.duration);

  say("Finding structure…");
  const energy = smoothNorm(bandE.full, Math.round(1 / frameDur));
  const sections = detectSections(energy, frameDur, buffer.duration);
  const drop = sections.filter(s => s.type === "drop")
    .map(s => ({ t: s.start, strength: 1 }));

  // normalised curves for modulation (0..1 against 95th percentile)
  const curves = {
    bass: normCurve(bandE.bass), mid: normCurve(bandE.mid),
    high: normCurve(bandE.high), energy, loudness: normCurve(bandE.full),
  };

  // waveform peaks for drawing
  const W = 2000, waveform = new Float32Array(W);
  const per = Math.max(1, Math.floor(n / W));
  for (let i = 0; i < W; i++) {
    let m = 0;
    for (let j = i * per; j < Math.min(n, (i + 1) * per); j += 16) m = Math.max(m, Math.abs(mono[j]));
    waveform[i] = m;
  }

  return {
    sampleRate: sr, duration: buffer.duration, frameDur,
    bpm, beats, bars, curves,
    events: { kick, snare, hat, drop },
    sections, waveform,
  };
}

const tick = () => new Promise(r => setTimeout(r, 0));

// adaptive-threshold peak picking over a flux curve (V1 rolling-average
// idea, offline: local mean over ~1s window, refractory period)
function pickEvents(flux, frameDur, sens, refractory) {
  const win = Math.round(1 / frameDur);
  const out = [];
  let sum = 0;
  const q = [];
  let peak = 0;
  for (let f = 0; f < flux.length; f++) peak = Math.max(peak, flux[f]);
  if (peak <= 0) return out;
  let lastT = -1;
  for (let f = 0; f < flux.length; f++) {
    sum += flux[f]; q.push(flux[f]);
    if (q.length > win) sum -= q.shift();
    const mean = sum / q.length;
    const t = f * frameDur;
    const isPeak = f > 0 && f < flux.length - 1 && flux[f] >= flux[f - 1] && flux[f] >= flux[f + 1];
    if (isPeak && flux[f] > mean * sens && flux[f] > peak * 0.05 && t - lastT > refractory) {
      out.push({ t, strength: Math.min(1, flux[f] / (peak * 0.6)) });
      lastT = t;
    }
  }
  return out;
}

// BPM via onset autocorrelation (kept from V1) + grid phase search
function tempo(onset, frameDur, duration) {
  const len = Math.min(onset.length, Math.round(90 / frameDur));
  const minLag = Math.round(60 / (180 * frameDur)), maxLag = Math.round(60 / (80 * frameDur));
  let bestLag = minLag, bestScore = -1;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0;
    for (let i = 0; i < len - lag; i++) s += onset[i] * onset[i + lag];
    s *= 1 + (maxLag - lag) / maxLag * 0.08;
    if (s > bestScore) { bestScore = s; bestLag = lag; }
  }
  const bpm = Math.round(60 / (bestLag * frameDur) * 10) / 10;
  const period = 60 / bpm;

  // phase: maximise summed onset at grid positions over first 30s
  const phaseSteps = Math.max(1, Math.round(period / frameDur));
  let bestPhase = 0, bestP = -1;
  for (let p = 0; p < phaseSteps; p++) {
    let s = 0;
    for (let t = p * frameDur; t < Math.min(30, duration); t += period) {
      const f = Math.round(t / frameDur);
      if (f < onset.length) s += onset[f];
    }
    if (s > bestP) { bestP = s; bestPhase = p; }
  }
  const t0 = bestPhase * frameDur;
  const beats = [];
  for (let t = t0; t < duration; t += period) beats.push(t);
  const bars = beats.filter((_, i) => i % 4 === 0);
  return { bpm, beats: Float64Array.from(beats), bars: Float64Array.from(bars) };
}

function smoothNorm(arr, win) {
  const out = new Float32Array(arr.length);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= win) sum -= arr[i - win];
    out[i] = sum / Math.min(i + 1, win);
  }
  const peak = Math.max(...out) || 1;
  for (let i = 0; i < out.length; i++) out[i] /= peak;
  return out;
}

function normCurve(arr) {
  const sorted = Float32Array.from(arr).sort();
  const ref = sorted[Math.floor(sorted.length * 0.95)] || 1;
  const out = new Float32Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = Math.min(1, arr[i] / ref);
  return out;
}

// V1 energy-quantile segmentation (§5.1), with build detection kept
function detectSections(energy, frameDur, duration) {
  const bf = Math.round(1 / frameDur), nB = Math.ceil(energy.length / bf);
  const bE = new Float32Array(nB);
  for (let b = 0; b < nB; b++) {
    let s = 0, c = 0;
    for (let f = b * bf; f < Math.min(energy.length, (b + 1) * bf); f++) { s += energy[f]; c++; }
    bE[b] = c ? s / c : 0;
  }
  const sorted = Array.from(bE).sort((a, b) => a - b);
  const q = p => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
  const hi = q(0.65), lo = q(0.30);
  const labels = Array.from(bE, e => e >= hi ? "high" : e <= lo ? "low" : "mid");
  let runs = [];
  for (let b = 0; b < nB; b++) {
    if (runs.length && runs[runs.length - 1].label === labels[b]) runs[runs.length - 1].len++;
    else runs.push({ label: labels[b], start: b, len: 1 });
  }
  runs = runs.filter(r => r.len >= 4 || runs.length === 1);
  if (!runs.length) runs.push({ label: "mid", start: 0, len: nB });
  runs[0].start = 0;
  for (let i = 0; i < runs.length; i++) {
    const end = i + 1 < runs.length ? runs[i + 1].start : nB;
    runs[i].len = end - runs[i].start;
  }
  const sections = [];
  let seenHigh = false;
  for (let i = 0; i < runs.length; i++) {
    const r = runs[i], start = r.start, end = Math.min(duration, r.start + r.len);
    let type;
    if (r.label === "high") { type = "drop"; seenHigh = true; }
    else if (r.label === "low") type = i === 0 ? "intro" : i === runs.length - 1 ? "outro" : seenHigh ? "breakdown" : "intro";
    else type = runs[i + 1] && runs[i + 1].label === "high" ? "build" : "groove";
    sections.push({ start, end, type });
  }
  return sections.length ? sections : [{ start: 0, end: duration, type: "groove" }];
}

const sectionAt = (sections, t) =>
  sections.find(s => t >= s.start && t < s.end) ||
  (sections.length && t < sections[0].start ? sections[0] : sections[sections.length - 1]) || null;

// ===== js/core/project.js =====
// Project model (spec §9, §16). Tracks own clips; clips reference a
// generator id, carry params, modulation slots, a seed, and a mode.
// Undo is snapshot-based over the serializable part.

let nextId = 1;
const uid = () => nextId++;

const TRACK_TYPES = ["camera", "adjust", "visual", "transition"];

function makeProject(name = "Untitled") {
  return {
    name,
    audioName: null,
    palette: "cyberpunk",
    seed: 1,
    tracks: [],            // top of list renders last (on top)
    analysisOverrides: null,
  };
}

function makeTrack(type, name) {
  return { id: uid(), type, name, mute: false, solo: false, lock: false, clips: [] };
}

function makeClip(genId, start, end, params = {}, opts = {}) {
  return {
    id: uid(), gen: genId, start, end,
    params,                // key -> value (universal + specific), sparse over defaults
    mods: opts.mods || [], // modulation slots (§8)
    mode: opts.mode || "auto",   // auto | manual
    seed: opts.seed ?? 1,
    auto: opts.auto || false,    // Director badge: regenerate may replace while true
    fadeIn: opts.fadeIn ?? 0, fadeOut: opts.fadeOut ?? 0,
  };
}

// Standard track set the Director targets (spec §9.8)
function defaultTracks() {
  return [
    makeTrack("transition", "Transitions"),
    makeTrack("adjust", "FX / Colour"),
    makeTrack("camera", "Camera"),
    makeTrack("visual", "Accents"),
    makeTrack("visual", "Main"),
    makeTrack("visual", "Background"),
  ];
}

function clipsAt(project, t) {
  // returns active clips bottom-to-top: visual tracks (list bottom = first),
  // then adjust, transition; camera handled separately
  const layers = { visual: [], adjust: [], transition: [], camera: [] };
  const anySolo = project.tracks.some(tr => tr.solo);
  for (let i = project.tracks.length - 1; i >= 0; i--) {   // bottom-up
    const tr = project.tracks[i];
    if (tr.mute || (anySolo && !tr.solo)) continue;
    for (const c of tr.clips) {
      if (t >= c.start && t < c.end) layers[tr.type].push(c);
    }
  }
  return layers;
}

function findClip(project, id) {
  for (const tr of project.tracks)
    for (const c of tr.clips)
      if (c.id === id) return { track: tr, clip: c };
  return null;
}

function removeClip(project, id) {
  for (const tr of project.tracks) {
    const i = tr.clips.findIndex(c => c.id === id);
    if (i >= 0) { tr.clips.splice(i, 1); return true; }
  }
  return false;
}

function sortTrack(tr) { tr.clips.sort((a, b) => a.start - b.start); }

// ---------- serialization ----------
function serialize(project) {
  return JSON.stringify(project);
}
function deserialize(json) {
  const p = JSON.parse(json);
  // bump uid counter past everything loaded
  let max = 0;
  for (const tr of p.tracks) {
    max = Math.max(max, tr.id);
    for (const c of tr.clips) max = Math.max(max, c.id);
  }
  nextId = max + 1;
  return p;
}

// ---------- undo (snapshots, spec §15.5 scaled down) ----------
const UNDO_CAP = 100;
function makeHistory(project) {
  return { undo: [], redo: [], last: serialize(project) };
}
function commit(history, project) {
  const now = serialize(project);
  if (now === history.last) return;
  history.undo.push(history.last);
  if (history.undo.length > UNDO_CAP) history.undo.shift();
  history.redo.length = 0;
  history.last = now;
}
function undo(history, project) {
  if (!history.undo.length) return null;
  history.redo.push(history.last);
  history.last = history.undo.pop();
  return deserialize(history.last);
}
function redo(history) {
  if (!history.redo.length) return null;
  history.undo.push(history.last);
  history.last = history.redo.pop();
  return deserialize(history.last);
}

// ---------- autosave (spec §15.6, localStorage-backed in this build) ----------
const RECENT_KEY = "poopdog.v2.recent";
function autosave(project) {
  try {
    const list = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]")
      .filter(e => e.name !== project.name);
    list.unshift({
      name: project.name, audioName: project.audioName,
      savedAt: Date.now(), project: serialize(project),
    });
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8)));
  } catch (e) { /* storage full: autosave is best-effort */ }
}
function recentProjects() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
  catch (e) { return []; }
}

// ===== js/core/generators.js =====
// Generator registry (spec §6). Every generator is:
//   { id, name, category, track ("visual"|"adjust"|"transition"|"camera"),
//     params: [{key,label,min,max,step,def} | {key,label,select,def}],
//     defaultMods: [slot...],       — factory audio bindings (§8.4)
//     draw(g) }                     — pure function of g (no retained state)
//
// g = { ctx, w, h, t (clip-local, speed-applied), T (global), p (params),
//       a (audio source values), c(i,alpha,boost) palette colour,
//       glowPx, seed, h01(i), clip, events, beats, bpm, progress }


const TAU = Math.PI * 2;
const REGISTRY = new Map();
const def = g => REGISTRY.set(g.id, g);
const P = (key, label, min, max, def_, step = 0.01) => ({ key, label, min, max, def: def_, step });

function beams(g, count, fn) {
  const { ctx } = g;
  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < count; i++) {
    ctx.strokeStyle = g.c(i, 0.4 + g.a.loudness * 0.55, 10);
    ctx.lineWidth = 1.5 + g.a.bass * 8 * g.p.intensity;
    ctx.shadowBlur = g.glowPx;
    ctx.shadowColor = g.c(i, 0.8);
    ctx.beginPath();
    fn(i, ctx);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

def({

    const { w, h } = g, rot = g.t * 0.4;
    beams(g, g.p.beams * 2, (i, ctx) => {
      const side = i % 2, k = (i / 2) | 0, ox = side ? w : 0, dir = side ? -1 : 1;
      const a = -Math.PI / 2 + dir * (Math.sin(rot * g.p.sway + k * 0.35) * g.p.spread * 0.5 + 0.35);
      ctx.moveTo(ox, h);
      ctx.lineTo(ox + Math.cos(a) * h * 1.9, h + Math.sin(a) * h * 1.9);
    });
  },
});

      if (horiz) { ctx.moveTo(0, p * h + sw); ctx.lineTo(w, p * h - sw); }

def({

def({

// ============================== TUNNELS ==============================

function tunnelRings(g, drawRing) {
  const { ctx, w, h } = g;
  const cx = w / 2 + Math.sin(g.t * 0.4) * w * 0.05, cy = h / 2 + Math.cos(g.t * 0.31) * h * 0.05;
  const maxR = Math.hypot(w, h) * 0.6, rings = 13;
  const travel = g.t * 0.22 * (g.bpm / 120) * (1 + g.a.kick * 1.2);
  ctx.save();
  for (let i = 0; i < rings; i++) {
    const depth = ((i / rings) + travel) % 1;
    const r = Math.pow(depth, 2.4) * maxR * (1 + g.a.kick * 0.15);
    if (r < 2) continue;
    ctx.strokeStyle = g.c(i, Math.min(0.85, depth * 1.1) * (0.45 + g.a.loudness * 0.55), depth * 15);
    ctx.lineWidth = 1 + depth * (3 + g.a.bass * 6);
    ctx.shadowBlur = g.glowPx * depth;
    ctx.shadowColor = g.c(i, 0.8);
    ctx.beginPath();
    drawRing(cx, cy, r, depth, i, ctx);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
  return { cx, cy, maxR };
}

const poly = (ctx, cx, cy, r, sides, rot) => {
  for (let k = 0; k <= sides; k++) {
    const a = rot + (k / sides) * TAU;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
};

def({
  id: "tunnel.star", name: "Star Tunnel", category: "Tunnels", track: "visual",
  params: [P("stars", "Streaks", 40, 220, 120, 1), P("rush", "Rush", 0.2, 4, 1.4)],
  defaultMods: [makeSlot("rush", "energy", 0.5)],
  draw(g) {
    const { ctx, w, h } = g, cx = w / 2, cy = h / 2, n = g.p.stars | 0;
    ctx.save();
    ctx.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const a = g.h01(i) * TAU;
      const cycle = 1.6 / g.p.rush;
      const z = 1 - ((g.t / cycle + g.h01(i + 9000)) % 1);        // 1 far -> 0 near
      const r0 = Math.pow(1 - z, 2.2) * Math.hypot(w, h) * 0.7;
      const r1 = Math.pow(Math.min(1, 1 - z + 0.05 + g.a.kick * 0.06), 2.2) * Math.hypot(w, h) * 0.7;
      ctx.strokeStyle = g.c(i % 4, (1 - z) * 0.9, (1 - z) * 25);
      ctx.lineWidth = (1 - z) * 3 + 0.4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  },
});

      const r = ph * Math.min(w, h) * 0.55;
      ctx.strokeStyle = g.c(i, (1 - ph) * 0.8, 10 + g.a.high * 20);
      ctx.lineWidth = 2 + (1 - ph) * 6;
      ctx.shadowBlur = g.glowPx * (1 - ph);
      ctx.shadowColor = g.c(i, 0.8);
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.6, Math.sin(g.t * 0.3) * 0.4, 0, TAU);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "geo.terrain", name: "Wireframe Terrain", category: "Geometry", track: "visual",

    ctx.save();
    ctx.lineWidth = 1.4;
    for (let r = 0; r < rows; r++) {
      const z = (r + (g.t * 2) % 1) / rows;                 // 0 near horizon
      const y = h * 0.45 + Math.pow(z, 1.6) * h * 0.55;
      const persp = 0.15 + z * 0.85;
      ctx.strokeStyle = g.c(r % 4, 0.25 + z * 0.6, z * 10);
      ctx.shadowBlur = g.glowPx * z * 0.5;
      ctx.shadowColor = g.c(r % 4, 0.6);
      ctx.beginPath();
      for (let cIdx = 0; cIdx <= cols; cIdx++) {
        const u = cIdx / cols;
        const x = w / 2 + (u - 0.5) * w * 1.4 * persp;
        const noise = Math.sin(u * 9 + g.t * 1.3 + r) * Math.cos(u * 5 - g.t) * g.p.amp;
        const yy = y - Math.abs(noise) * h * 0.18 * z * (0.4 + g.a.bass);
        cIdx === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "geo.mandala", name: "Mandala", category: "Geometry", track: "visual",
  params: [P("petals", "Petals", 4, 16, 8, 1), P("depth", "Depth", 1, 4, 2, 1)],
  defaultMods: [makeSlot("hueShift", "snare", 0.3, 0, 300)],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.petals | 0, R = Math.min(w, h) * 0.38;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(g.t * 0.15);
    for (let d = 0; d < g.p.depth; d++) {
      const r = R * (1 - d * 0.3);
      ctx.strokeStyle = g.c(d, 0.65, g.a.high * 20);
      ctx.lineWidth = 1.8;
      ctx.shadowBlur = g.glowPx * 0.7;
      ctx.shadowColor = g.c(d, 0.7);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, r * 0.5, r * 0.22 * (1 + g.a.bass * 0.5), a, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

// ============================== PARTICLES ==============================
// Deterministic: particle i state at time t is a pure function of
// (seed, i, t) — scrubbing and export sample identically (spec §3).

def({
  id: "part.sparks", name: "Kick Sparks", category: "Particles", track: "visual",
  params: [P("perBurst", "Per burst", 6, 60, 26, 1), P("life", "Life (s)", 0.3, 2.5, 1.1), P("vel", "Velocity", 50, 600, 260, 1)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g;
    ctx.save();
    const life = g.p.life, K = g.p.perBurst | 0;
    for (const e of g.events.kick) {
      const age = g.T - e.t;
      if (age < 0 || age > life) continue;
      const bSeed = Math.round(e.t * 997);
      for (let i = 0; i < K; i++) {
        const a = hash01(g.seed + bSeed, i) * TAU;
        const v = g.p.vel * (0.4 + hash01(g.seed + bSeed, i + 500) * 0.8) * (0.5 + e.strength);
        const x = w / 2 + Math.cos(a) * v * age, y = h / 2 + Math.sin(a) * v * age + 40 * age * age;
        const lf = 1 - age / life;
        ctx.fillStyle = g.c(i % 4, lf * 0.9, g.a.high * 25);
        ctx.shadowBlur = g.glowPx * 0.5;
        ctx.shadowColor = g.c(i % 4, 0.8);
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.4, (1 + hash01(g.seed + bSeed, i + 900) * 2.5) * lf), 0, TAU);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "part.starfield", name: "Starfield", category: "Particles", track: "visual",
  params: [P("count", "Stars", 40, 300, 140, 1)],
  defaultMods: [makeSlot("intensity", "high", 0.3)],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.count | 0;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const x = g.h01(i) * w, y = g.h01(i + 5000) * h;
      const tw = 0.4 + 0.6 * Math.sin(g.t * (1 + g.h01(i + 999) * 3) + g.h01(i) * TAU) ** 2;
      ctx.fillStyle = g.c(i % 4, tw * (0.5 + g.a.high * 0.5), 20);
      ctx.beginPath();
      ctx.arc(x, y, 0.6 + g.h01(i + 70) * 1.8 * tw, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  },
});

def({
  id: "part.confetti", name: "Confetti", category: "Particles", track: "visual",
  params: [P("count", "Pieces", 30, 200, 90, 1), P("fall", "Fall speed", 20, 200, 80, 1)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.count | 0;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const speed = g.p.fall * (0.5 + g.h01(i));
      const y = ((g.h01(i + 300) * h + g.t * speed) % (h + 30)) - 15;
      const x = g.h01(i) * w + Math.sin(g.t * 2 + i) * 22;
      ctx.fillStyle = g.c(i % 4, 0.85, 5);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(g.t * (1 + g.h01(i + 60) * 3) + i);
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    ctx.restore();
  },
});

def({
  id: "part.embers", name: "Rising Embers", category: "Particles", track: "visual",
  params: [P("count", "Embers", 20, 160, 70, 1)],
  defaultMods: [makeSlot("intensity", "bass", 0.3)],
  draw(g) {

    ctx.save();
    for (let i = 0; i < n; i++) {

      const y = h + 10 - ((g.h01(i + 44) * h + g.t * speed) % (h + 30));
      const x = g.h01(i) * w + Math.sin(g.t * 1.4 + i * 2.6) * 30;
      const a = 0.3 + 0.7 * ((y / h));
      ctx.fillStyle = g.c(i % 4, a * (0.5 + g.a.bass * 0.5), 15);
      ctx.shadowBlur = g.glowPx * 0.4;
      ctx.shadowColor = g.c(i % 4, 0.7);
      ctx.beginPath();

def({
  id: "part.shockwave", name: "Kick Shockwaves", category: "Particles", track: "visual",
  params: [P("speed", "Expand", 100, 1200, 500, 1), P("width", "Width", 1, 16, 6)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g;
    ctx.save();
    for (const e of g.events.kick) {
      const age = g.T - e.t;
      if (age < 0 || age > 1.2) continue;
      const r = age * g.p.speed, a = Math.max(0, 1 - age / 1.2) * e.strength;
      ctx.strokeStyle = g.c(2, a * 0.85, 20);
      ctx.lineWidth = g.p.width * (1 - age * 0.6);
      ctx.shadowBlur = g.glowPx;
      ctx.shadowColor = g.c(2, 0.8);
      ctx.beginPath(); ctx.arc(w / 2, h / 2, r, 0, TAU); ctx.stroke();
    }
    ctx.shadowBlur = 0;

def({
  id: "bg.gradient", name: "Gradient Field", category: "Backgrounds", track: "visual",
  params: [P("drift", "Drift", 0, 2, 0.6)],
  defaultMods: [makeSlot("intensity", "energy", 0.4)],
  draw(g) {
    const { ctx, w, h } = g;
    const cx = w / 2 + Math.sin(g.t * g.p.drift) * w * 0.2;
    const cy = h / 2 + Math.cos(g.t * g.p.drift * 0.7) * h * 0.2;
    const grad = ctx.createRadialGradient(cx, cy, 0, w / 2, h / 2, Math.hypot(w, h) * 0.6);
    grad.addColorStop(0, g.c(0, 0.35 * g.p.intensity, 0));
    grad.addColorStop(0.6, g.c(1, 0.18 * g.p.intensity, -10));
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  },
});

def({
  id: "bg.grid", name: "Perspective Grid", category: "Backgrounds", track: "visual",
  params: [P("lines", "Lines", 6, 24, 12, 1)],
  defaultMods: [makeSlot("intensity", "bass", 0.35)],
  draw(g) {
    const { ctx, w, h } = g, horizon = h * 0.45;
    ctx.save();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = g.c(1, 0.5, 5);
    ctx.shadowBlur = g.glowPx * 0.4;
    ctx.shadowColor = g.c(1, 0.6);
    for (let i = 0; i < g.p.lines; i++) {           // scrolling horizontals
      const z = ((i / g.p.lines) + g.t * 0.4) % 1;
      const y = horizon + Math.pow(z, 2) * (h - horizon);
      ctx.globalAlpha = z;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.globalAlpha = 0.6;
    for (let i = -8; i <= 8; i++) {                 // verticals converging
      ctx.beginPath(); ctx.moveTo(w / 2 + i * 30, horizon); ctx.lineTo(w / 2 + i * w * 0.12, h);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "bg.nebula", name: "Nebula", category: "Backgrounds", track: "visual",
  params: [P("blobs", "Density", 3, 12, 6, 1)],
  defaultMods: [makeSlot("intensity", "energy", 0.4)],
  draw(g) {
    const { ctx, w, h } = g;
    for (let i = 0; i < g.p.blobs; i++) {
      const x = (g.h01(i) + Math.sin(g.t * 0.13 + i * 2.4) * 0.12) * w;
      const y = (g.h01(i + 31) + Math.cos(g.t * 0.11 + i * 1.7) * 0.12) * h;
      const r = (0.18 + g.h01(i + 77) * 0.25) * Math.min(w, h) * (1 + g.a.bass * 0.15);
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, g.c(i % 4, 0.16 * g.p.intensity, 5));
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  },
});

def({
  id: "bg.matrix", name: "Matrix Rain", category: "Backgrounds", track: "visual",
  params: [P("cols", "Columns", 12, 60, 32, 1)],
  defaultMods: [makeSlot("intensity", "high", 0.3)],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.cols | 0, cw = w / n;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const speed = 120 + g.h01(i) * 260;
      const head = (g.h01(i + 12) * h + g.t * speed) % (h + 160);
      for (let k = 0; k < 9; k++) {
        const y = head - k * 16;
        if (y < -16 || y > h) continue;
        ctx.fillStyle = g.c(i % 4, (1 - k / 9) * 0.8, k === 0 ? 35 : 0);
        ctx.fillRect(i * cw + cw * 0.25, y, cw * 0.5, 9);
      }
    }
    ctx.restore();
  },
});

def({
  id: "bg.sun", name: "Synthwave Sun", category: "Backgrounds", track: "visual",
  params: [P("size", "Size", 0.1, 0.5, 0.26), P("slats", "Slats", 0, 10, 6, 1)],
  defaultMods: [makeSlot("size", "bass", 0.15)],
  draw(g) {
    const { ctx, w, h } = g, r = g.p.size * Math.min(w, h), cx = w / 2, cy = h * 0.42;
    ctx.save();
    const grad = ctx.createLinearGradient(0, cy - r, 0, cy + r);
    grad.addColorStop(0, g.c(0, 0.95, 15));
    grad.addColorStop(1, g.c(3, 0.9, 0));
    ctx.fillStyle = grad;
    ctx.shadowBlur = g.glowPx * 1.5;
    ctx.shadowColor = g.c(0, 0.9);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = "destination-out";     // slats cut out
    for (let i = 0; i < g.p.slats; i++) {
      const y = cy + r * 0.15 + i * (r * 0.85 / Math.max(1, g.p.slats));
      ctx.fillRect(cx - r, y, r * 2, 2 + i * 1.5);
    }
    ctx.restore();
  },
});

def({
  id: "spec.bars", name: "Bar Equalizer", category: "Spectrum", track: "visual",
  params: [P("bars", "Bars", 8, 48, 24, 1)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.bars | 0, bw = w / n;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const u = i / n;
      // pseudo-spectrum from the three band curves, shaped per bar
      const v = u < 0.33 ? g.a.bass * (1 - u) : u < 0.66 ? g.a.mid : g.a.high * (0.5 + g.h01(i) * 0.8);
      const bh = Math.pow(v, 1.2) * h * 0.7 * g.p.intensity;
      ctx.fillStyle = g.c(i % 4, 0.8, v * 25);
      ctx.shadowBlur = g.glowPx * 0.5;
      ctx.shadowColor = g.c(i % 4, 0.7);
      ctx.fillRect(i * bw + bw * 0.15, h - bh, bw * 0.7, bh);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "spec.circle", name: "Circular Spectrum", category: "Spectrum", track: "visual",
  params: [P("spokes", "Spokes", 16, 96, 48, 1)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g, n = g.p.spokes | 0, R = Math.min(w, h) * 0.22;
    ctx.save();
    ctx.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const u = i / n, a = u * TAU + g.t * 0.3;
      const v = u < 0.33 ? g.a.bass : u < 0.66 ? g.a.mid : g.a.high;
      const len = R * 0.3 + Math.pow(v, 1.3) * R * (0.8 + g.h01(i) * 0.5);
      ctx.strokeStyle = g.c(i % 4, 0.85, v * 25);
      ctx.lineWidth = 3;
      ctx.shadowBlur = g.glowPx * 0.5;
      ctx.shadowColor = g.c(i % 4, 0.7);
      ctx.beginPath();
      ctx.moveTo(w / 2 + Math.cos(a) * R, h / 2 + Math.sin(a) * R);
      ctx.lineTo(w / 2 + Math.cos(a) * (R + len), h / 2 + Math.sin(a) * (R + len));
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },
});

def({
  id: "fx.vignette", name: "Vignette + Grain", category: "FX", track: "adjust",
  params: [P("dark", "Darkness", 0, 1, 0.55)],
  defaultMods: [],
  draw(g) {
    const { ctx, w, h } = g;
    const grad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.6);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, `rgba(0,0,0,${g.p.dark * g.p.intensity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // sparse deterministic grain
    const fseed = (g.t * 24) | 0;
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    for (let i = 0; i < 120; i++) {
      ctx.fillRect(hash01(fseed, i) * w, hash01(fseed, i + 999) * h, 1.5, 1.5);
    }
  },
});

def({
  id: "fx.rgbsplit", name: "RGB Split", category: "FX", track: "adjust",
  params: [P("shift", "Shift px", 0, 30, 8, 1)],
  defaultMods: [makeSlot("shift", "kick", 0.6, 0, 120)],
  draw(g) {
    const off = g.p.shift * g.p.intensity;
    if (off < 0.5 || !g.snapshot) return;
    const { ctx, w, h } = g, snap = g.snapshot();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.5;
    ctx.filter = "hue-rotate(120deg)";
    ctx.drawImage(snap, off, 0, w, h);
    ctx.filter = "hue-rotate(-120deg)";
    ctx.drawImage(snap, -off, 0, w, h);
    ctx.filter = "none";
    ctx.restore();
  },
});

def({
  id: "fx.invert", name: "Invert Flash", category: "FX", track: "adjust",

def({
  id: "trans.glitch", name: "Glitch Cut", category: "Transitions", track: "transition",
  params: [P("slices", "Slices", 3, 20, 9, 1)],
  defaultMods: [],
  draw(g) {
    if (!g.snapshot) return;
    const { ctx, w, h } = g, snap = g.snapshot();
    const step = ((g.T * 24) | 0), n = g.p.slices | 0;
    const amt = Math.sin(Math.min(1, Math.max(0, g.progress)) * Math.PI);
    ctx.save();
    for (let i = 0; i < n; i++) {
      const y = (i / n) * h, sh = h / n;
      const dx = (hash01(step, i) - 0.5) * w * 0.25 * amt;
      ctx.drawImage(snap, 0, y, w, sh, dx, y, w, sh);
    }
    ctx.restore();
  },
});
